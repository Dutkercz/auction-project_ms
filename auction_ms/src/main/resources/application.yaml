spring:
  application:
    name: auction_ms
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/auction_db?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:$CDB1234r}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: "http://localhost:29092"

server:
  port: 8082