spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auction
              uri: http://localhost:8082
              predicates:
                - Path=/auctions/**
              filters:
                - PrefixPath=/api/v1

            - id: bids
              uri: http://localhost:8082
              predicates:
                - Path=/bids/**
              filters:
                - PrefixPath=/api/v1

            - id: users
              uri: http://localhost:8081
              predicates:
                - Path=/users/**
              filters:
                - PrefixPath=/api/v1
